<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación de Imágenes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #slideshow-image {
            max-width: 100%;
            max-height: 100%;
            opacity: 1; /* Mostrar la imagen por defecto */
            transition: opacity 1s ease-in-out; /* Aplicar la transición */
        }

        #empty-state {
            display: none;
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 1.5em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="slideshow-container">
        <img id="slideshow-image" src="" alt="Imagen de presentación">
        <div id="empty-state">Esperando fotos... escaneá el QR para subir la tuya</div>
    </div>
    <script>
        const imageDuration = 5000; // duracion de la imagen
        const fadeDuration = 1000; // fade out
        const refreshInterval = 10000; // cada cuanto se refresca la lista de imagenes

        let images = [];
        let currentIndex = 0;

        async function loadImages() {
            try {
                const response = await fetch('/imagenes-list?order=asc');
                const data = await response.json();
                return data.images;
            } catch (error) {
                console.error('Error al cargar las imágenes:', error);
                return [];
            }
        }

        function preload(imageSrc) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img.src);
                img.onerror = () => resolve(null);
                img.src = `/imagenes/${imageSrc}`;
            });
        }

        // Mostrar una imagen en la presentación
        async function showImage(imageSrc) {
            const src = await preload(imageSrc);
            if (!src) return;

            const imgElement = document.getElementById('slideshow-image');
            imgElement.style.opacity = 0;

            setTimeout(() => {
                imgElement.src = src;
                imgElement.onload = () => {
                    imgElement.style.opacity = 1;
                };
            }, fadeDuration);
        }

        function updateEmptyState() {
            const imgElement = document.getElementById('slideshow-image');
            const emptyState = document.getElementById('empty-state');
            const isEmpty = images.length === 0;
            emptyState.style.display = isEmpty ? 'block' : 'none';
            imgElement.style.display = isEmpty ? 'none' : 'block';
        }

        // Refresca periódicamente la lista de imágenes (por si se suben nuevas)
        async function refreshImages() {
            images = await loadImages();
            currentIndex = images.length ? currentIndex % images.length : 0;
            updateEmptyState();
        }

        // presentador de imágenes
        async function startSlideshow() {
            await refreshImages();
            setInterval(refreshImages, refreshInterval);

            setInterval(() => {
                if (images.length === 0) return;
                showImage(images[currentIndex]);
                currentIndex = (currentIndex + 1) % images.length;
            }, imageDuration);
        }

        startSlideshow();
    </script>
</body>
</html>
